name: Build (Swift)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test (Swift)
    # The Kotlin/Native 2.3.x distribution ships prebuilt platform caches
    # (liborg.jetbrains.kotlin.native.platform.{CoreFoundation,Foundation,darwin}-cache.a)
    # that reference macOS 26 / iOS 26 SDK symbols — NSCalendarIdentifierVikram,
    # NSURLUbiquitousItemSupportedSyncControlsKey, mach_vm_reclaim_update_kernel_accounting_trap,
    # xpc_session_set_peer_requirement, etc. macos-latest currently resolves to
    # macos-15 (Xcode 16 SDK) and `swift test` link fails with "Undefined symbols
    # for architecture arm64" on every one of those when the repo's Kotlin code
    # reaches into Foundation / CoreFoundation / darwin platform APIs. Pin
    # macos-26 uniformly so the SDK in
    # /Applications/Xcode_26.x.app/Contents/Developer/Platforms provides the
    # symbol stubs the cache expects.
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5.2.0
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.1.1

      # NOTE: do NOT add a `maxim-lobanov/setup-xcode` step here.
      # KotlinMania's enterprise GitHub Actions policy does not whitelist
      # third-party actions; a workflow that references one returns
      # startup_failure with zero jobs spawned. The macos-26 image's default
      # Xcode is already in the 26.x line (currently 26.4.1) and supplies the
      # macOS 26 SDK symbols the Kotlin/Native 2.3.x platform caches expect.
      # A working run prints "Target: arm64-apple-macosx26.0" from
      # `swift --version` straight off the image default.
      - name: Print Swift / Xcode versions
        run: |
          swift --version
          xcodebuild -version

      # `swiftExportSmokeTest` is the local source of truth for the Swift
      # Export contract. It invokes `embedSwiftExportForXcode` with the
      # Xcode-style environment, patches generated Package.swift platform
      # declarations, copies the generated SPM packages into
      # build/swift-test-packages/, then runs both Swift harnesses:
      #   * swift-test-harness imports the public Klang module.
      #   * swift-common-test-harness imports the generated commonTest runner.
      - name: Run Swift Export smoke tests
        run: ./gradlew swiftExportSmokeTest --no-configuration-cache --console=plain

      - name: Upload Swift Export artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: swift-export-artifacts
          path: |
            build/swift-test/lib*.a
            build/swift-test/*.swiftmodule/
            build/SPMPackage/macosArm64/Debug/
            build/swift-test-packages/
            swift-common-test-export/build/SPMPackage/macosArm64/Debug/
          retention-days: 7
          if-no-files-found: warn
